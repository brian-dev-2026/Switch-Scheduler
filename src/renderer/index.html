<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Power Scheduler</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <defs>
        <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10" /><path d="M18.4 6.6a9 9 0 1 1-12.77.04" /></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></symbol>
        <symbol id="i-restart" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></symbol>
        <symbol id="i-timer" viewBox="0 0 24 24"><path d="M10 2h4" /><path d="M12 14l3-3" /><circle cx="12" cy="14" r="8" /></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></symbol>
      </defs>
    </svg>

    <header class="titlebar">
      <span class="logo"><svg><use href="#i-power" /></svg></span>
      <span class="app-name">Power Scheduler</span>
      <span class="badge" id="dryBadge" hidden>DRY RUN</span>
    </header>

    <main>
      <section class="hero">
        <div class="date" id="date"></div>
        <div class="clock" id="clock"></div>
      </section>

      <section>
        <h2 class="section-title">Instant</h2>
        <div class="actions">
          <button class="action-card" data-action="sleep">
            <span class="icon-tile"><svg><use href="#i-moon" /></svg></span>
            <span class="action-name">Sleep</span>
            <span class="action-sub">Low power</span>
          </button>
          <button class="action-card" data-action="restart">
            <span class="icon-tile"><svg><use href="#i-restart" /></svg></span>
            <span class="action-name">Restart</span>
            <span class="action-sub">Reboot</span>
          </button>
          <button class="action-card" data-action="shutdown">
            <span class="icon-tile"><svg><use href="#i-power" /></svg></span>
            <span class="action-name">Shut down</span>
            <span class="action-sub">Power off</span>
          </button>
        </div>
      </section>

      <section>
        <h2 class="section-title">Schedule</h2>

        <div class="card" id="scheduleForm">
          <span class="field-label">Action</span>
          <div class="segmented" id="actionSeg">
            <button data-value="sleep" data-action="sleep" class="active">Sleep</button>
            <button data-value="restart" data-action="restart">Restart</button>
            <button data-value="shutdown" data-action="shutdown">Shut down</button>
          </div>

          <span class="field-label">When</span>
          <div class="segmented" id="modeSeg">
            <button data-value="delay" class="active"><svg><use href="#i-timer" /></svg>After a delay</button>
            <button data-value="time"><svg><use href="#i-clock" /></svg>At a time</button>
          </div>

          <div id="delayPane">
            <div class="duration">
              <label class="num">
                <input id="hours" type="number" min="0" max="167" value="0" />
                <span>hours</span>
              </label>
              <span class="colon">:</span>
              <label class="num">
                <input id="minutes" type="number" min="0" max="59" value="30" />
                <span>minutes</span>
              </label>
            </div>
            <div class="chips">
              <button data-min="15">15 min</button>
              <button data-min="30">30 min</button>
              <button data-min="60">1 hour</button>
              <button data-min="120">2 hours</button>
            </div>
          </div>

          <div id="timePane" hidden>
            <input id="atTime" type="time" />
          </div>

          <p class="summary" id="summary"></p>
          <button class="primary" id="startBtn">Start schedule</button>
        </div>

        <div class="card active-card" id="activeCard" hidden>
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 120 120">
              <circle class="track" cx="60" cy="60" r="54" />
              <circle class="progress" id="ringProgress" cx="60" cy="60" r="54" />
            </svg>
            <div class="ring-center">
              <span class="icon-tile small"><svg><use id="activeIcon" href="#i-moon" /></svg></span>
              <div class="countdown" id="countdown">00:00:00</div>
              <div class="ring-label" id="activeLabel"></div>
            </div>
          </div>
          <p class="active-at" id="activeAt"></p>
          <div class="row">
            <button class="ghost" id="extendBtn">+15 min</button>
            <button class="danger" id="cancelBtn">Cancel schedule</button>
          </div>
        </div>
      </section>
    </main>

    <div class="overlay" id="confirm" hidden>
      <div class="dialog">
        <div class="ring-wrap small">
          <svg class="ring" viewBox="0 0 120 120">
            <circle class="track" cx="60" cy="60" r="54" />
            <circle class="progress" id="confirmRing" cx="60" cy="60" r="54" />
          </svg>
          <div class="ring-center"><div class="confirm-secs" id="confirmSecs">5</div></div>
        </div>
        <h3 id="confirmTitle"></h3>
        <p class="muted" id="confirmNote"></p>
        <div class="row">
          <button class="ghost" id="confirmCancel">Cancel</button>
          <button class="danger" id="confirmNow">Do it now</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="renderer.js"></script>
  </body>
</html>
